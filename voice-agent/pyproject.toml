[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "miralvento-voice-agent"
version = "0.1.0"
description = "Agente de voz (LiveKit Agents) que atiende la llamada de la agencia con el catálogo kb-propiedades-voz.json"
# 3.12 a propósito: el Python del sistema es 3.14 y alguna dependencia nativa puede no tener wheel todavía.
requires-python = ">=3.12,<3.13"

dependencies = [
    "livekit-agents~=1.8",
    "livekit-plugins-ai-coustics~=0.3",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pyyaml",
    "ruff",
]

[tool.uv]
# Igual que el template agent-starter-python: yarl 1.24.1 salió solo con wheel cp310.
constraint-dependencies = ["yarl<1.24"]

# Los módulos viven en src/ como módulos sueltos (agent.py, catalog.py), igual que el template.
[tool.setuptools]
py-modules = ["agent", "catalog"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]
